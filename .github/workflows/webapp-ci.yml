name: webapp-ci

on:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/webapp-ci.yml"]
  pull_request:
    paths: ["webapp/**", ".github/workflows/webapp-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
